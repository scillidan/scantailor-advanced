name: Sync Upstream

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync from upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: master

      - name: Add upstream
        run: git remote add upstream https://github.com/vigri/scantailor-advanced.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream
        run: git merge upstream/master --no-edit

      - name: Push
        run: git push
