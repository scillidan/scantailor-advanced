name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.1.1-fc0c851)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Apply version
        run: |
          VER="${{ inputs.version }}"
          VER="${VER#v}"
          sed -i "s/^#define VERSION \"[^\"]*\"/#define VERSION \"${VER}\"/" version.h.in

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            qt5-qmake qtbase5-dev libqt5svg5-dev qttools5-dev \
            libboost-test-dev libboost-dev \
            libjpeg-dev libpng-dev libtiff-dev zlib1g-dev

      - name: Build .deb
        run: ./build-deb.sh build

      - name: Upload .deb
        uses: actions/upload-artifact@v5
        with:
          name: deb-package
          path: scantailor-advanced_*_amd64.deb

  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Apply version
        run: |
          VER="${{ inputs.version }}"
          VER="${VER#v}"
          sed -i "s/^#define VERSION \"[^\"]*\"/#define VERSION \"${VER}\"/" version.h.in

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            qt5-qmake qtbase5-dev libqt5svg5-dev qttools5-dev \
            libboost-test-dev libboost-dev \
            libjpeg-dev libpng-dev libtiff-dev zlib1g-dev \
            file

      - name: Build and install to AppDir
        run: |
          mkdir build-appimage && cd build-appimage
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr ..
          make -j$(nproc)
          make install DESTDIR=AppDir

      - name: Fix desktop file Version
        run: sed -i 's/^Version=.*/Version=1.0/' build-appimage/scantailor.desktop

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage
        env:
          VERSION: ${{ inputs.version }}
          DISABLE_COPYRIGHT_FILES_DEPLOYMENT: 1
        run: |
          cd build-appimage
          cp scantailor.desktop AppDir/usr/share/applications/scantailor.desktop
          export QMAKE=/usr/bin/qmake
          ../linuxdeploy-x86_64.AppImage --appdir AppDir -e AppDir/usr/bin/scantailor --output appimage
          OUT=$(ls -1 *.AppImage 2>/dev/null | head -1)
          mv "$OUT" "../scantailor-advanced-${{ inputs.version }}-x86_64.AppImage"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: scantailor-advanced-*-x86_64.AppImage

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Apply version
        shell: bash
        run: |
          VER="${{ inputs.version }}"
          VER="${VER#v}"
          sed -i "s/^#define VERSION \"[^\"]*\"/#define VERSION \"${VER}\"/" version.h.in
          sed -i "/if (\"\${VERSION}\" STREQUAL/i\  string(REGEX REPLACE \"-.*\" \"\" VERSION \"\${VERSION}\")" CMakeLists.txt
          sed -i 's/PRODUCTVERSION @APPLICATION_VERSION_MAJOR@,@APPLICATION_VERSION_MINOR@,@APPLICATION_VERSION_PATCH@$/PRODUCTVERSION @APPLICATION_VERSION_MAJOR@,@APPLICATION_VERSION_MINOR@,@APPLICATION_VERSION_PATCH@,0/' src/resources/win32/resources.rc.in
          sed -i 's/FILETYPE VFT_DLL/FILETYPE VFT_APP/' src/resources/win32/resources.rc.in

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt5
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2019_64"

      - name: Install vcpkg dependencies (image libs only)
        shell: bash
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          vcpkg install \
            libjpeg-turbo:x64-windows \
            libpng:x64-windows \
            tiff:x64-windows \
            zlib:x64-windows

      - name: Install Boost (complete headers)
        shell: bash
        run: |
          boost_version="1.84.0"
          boost_tag="${boost_version//./_}"
          curl -L -o boost.7z "https://sourceforge.net/projects/boost/files/boost/${boost_version}/boost_${boost_tag}.7z/download"
          7z x boost.7z -o"C:/" -y

      - name: Configure and build
        shell: bash
        run: |
          boost_tag="1_84_0"
          sed -i 's/find_package(Boost 1.60 COMPONENTS unit_test_framework REQUIRED)/find_package(Boost 1.60 REQUIRED)/' CMakeLists.txt
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPORTABLE_VERSION=ON \
            -DBUILD_TESTS=OFF \
            -DBOOST_ROOT="C:/boost_${boost_tag}" \
            -DBoost_NO_SYSTEM_PATHS=ON \
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -A x64
          cmake --build build --config Release

      - name: Deploy Qt
        shell: bash
        run: |
          cd build/Release
          windeployqt scantailor.exe --no-translations --no-opengl-sw --no-angle

      - name: Copy vcpkg DLLs
        shell: bash
        run: |
          cd build/Release
          cp C:/vcpkg/installed/x64-windows/bin/*.dll .

      - name: Create archive
        shell: bash
        run: |
          cd build/Release
          7z a -mx=9 "../../scantailor-advanced-${{ inputs.version }}-windows-x64.zip" .

      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: scantailor-advanced-*-windows-x64.zip

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-deb, build-appimage, build-windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master

      - uses: actions/download-artifact@v4
        with:
          name: deb-package
      - uses: actions/download-artifact@v4
        with:
          name: appimage
      - uses: actions/download-artifact@v4
        with:
          name: windows-zip

      - name: Generate SHA256 checksums
        run: sha256sum scantailor-advanced_*_amd64.deb scantailor-advanced-*-x86_64.AppImage scantailor-advanced-*-windows-x64.zip > checksums-sha256.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.version }}" \
            scantailor-advanced_*_amd64.deb \
            scantailor-advanced-*-x86_64.AppImage \
            scantailor-advanced-*-windows-x64.zip \
            checksums-sha256.txt \
            --title "${{ inputs.version }}" \
            --generate-notes
